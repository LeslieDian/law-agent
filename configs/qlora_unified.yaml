# ============================================================
# QLoRA 训练配置（统一法律适配器 unified）
# 阶段一：先训统一适配器打通全流程；流程稳定后再拆三适配器
# ============================================================
run_name: qlora_unified_v1

# ------------------------------------------------------------
# 底座模型选型（详见 docs/model_selection.md）
# 算力：实验服务器 2×A800 80GB —— 显存不再是约束
#   Qwen3-8B 4bit 常驻 5.66GB、LoRA r=16 单步峰值 9.14GB（已实测）
#
# 主力（已下载到服务器 models/Qwen3-8B）：Qwen/Qwen3-8B
#   ⚠️ HF 上不存在 Qwen3-8B-Instruct。Qwen3-8B 自带聊天模板，
#      支持思考/非思考双模式，非思考在 system/user 后加 /no_think
# 对照基线：Qwen/Qwen2.5-7B-Instruct（论文原方案）
# 进阶（160GB 显存下完全可行，作为额外消融）：Qwen3-14B / Qwen3-32B / Qwen3-30B-A3B
# 法律专用对照：LegalOne-R1-8B（清华，2026-01 开源，LexEval/LawBench 有成绩）
#
# ⚠️ 对比实验只允许换一个变量：底座一旦定下，E0–E5 必须用同一个底座跑完，
#    不要中途更换（换底座 = 全部适配器重训）
# ------------------------------------------------------------
model:
  base_model: "/mnt/data/lidian/law-agent/models/Qwen3-8B"   # 服务器本地路径
  hf_repo_id: "Qwen/Qwen3-8B"                                 # HF 仓库名（下载用）
  base_revision: "PIN_COMMIT_HASH"        # ★ 必须固定到具体 commit，不要用 main
  trust_remote_code: true
  dtype: bfloat16                         # transformers>=5.0 用 dtype，torch_dtype 已弃用
  attn_implementation: "sdpa"             # 服务器无 nvcc，无法编译 flash-attn；sdpa 已足够
  # 底座对比实验（见 docs/model_selection.md）
  base_model_candidates:
    - "Qwen/Qwen2.5-7B-Instruct"   # 论文原方案，作对照
    - "Qwen/Qwen3-8B"              # ★ 主力（已落地）
    - "Qwen/Qwen3-14B"             # 160GB 显存下可行，作规模消融
    - "Qwen/Qwen3-30B-A3B"         # MoE，与「混合专家」主题呼应，值得做一组
    - "LegalOne-R1-8B"             # 法律专用对照

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_seq_length: 4096                  # A800 80GB 下可放宽（原 12GB 方案只能 2048）
  micro_batch_size: 4                    # 原 12GB 方案只能 1
  gradient_accumulation_steps: 4         # 等效 batch = 16（与原方案等效，便于对比）
  gradient_checkpointing: true
  learning_rate: 0.0001
  num_train_epochs: 2
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  optim: paged_adamw_8bit
  bf16: true
  fp16: false
  logging_steps: 10
  save_strategy: epoch
  save_total_limit: 3
  seed: 42

data:
  train_file: data/train/train.jsonl
  dev_file: data/dev/dev.jsonl
  format: chat                         # messages 列表格式
  assistant_only_loss: true            # ★ 只对 assistant 段计算 loss
  chat_template: auto                  # 用底座自带模板（Qwen3 与 Qwen2 模板不同，勿硬编码）

output:
  output_dir: models/adapters/unified
  logging_dir: outputs/train_logs/unified

# ---- 冒烟测试（先跑通再上全量）----
smoke_test:
  enabled: true
  max_samples: 500
  checks:
    - chat_template 渲染正确
    - 仅 assistant 段计入 loss
    - loss 正常下降（无 NaN）
    - 记录显存峰值
