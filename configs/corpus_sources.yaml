  # ============================================================
  # B 级：协议不明 / unknown —— 仅内部探索，进论文实验集前必须确认授权
  # ============================================================

  - id: china-ai-law-challenge/cail2018
    hub: huggingface
    size_bytes: 1224600000       # ~1167.8 MB
    file_count: 11               # data/first_stage_train-0000{0..3}-of-00004.parquet
    license: unknown
    license_grade: B
    usage: [expert_train]
    note: >
      刑事一审判决：罪名 + 法条 + 刑期，刑法域的黄金标注。
      HF 上的 license 字段为 unknown；GitHub 仓库 china-ai-law-challenge/CAIL2018
