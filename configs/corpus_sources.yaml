    action_required: "联系主办方确认学术使用授权，或论文中明确披露来源与获取方式"

  - id: Kuugo/Chinese_Law
    hub: huggingface
    size_bytes: 7969178          # ~7.6 MB
    file_count: 238              # 238 个 .txt
