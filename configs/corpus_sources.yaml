# 法律语料候选源登记表（机器可读）
#
# 采集脚本（scripts/corpus/fetch_corpus.py）应直接读本文件，不要在脚本里硬编码数据集名。
# 所有 size_bytes / license 字段均为 2026-09-17 在服务器 192.168.195.61 上实测所得，
# 探测脚本：scripts/benchmarks/probe_hf_datasets{1,2,3,4}.py
#
# license_grade 语义（决定能否进论文实验集）：
#   A = 协议明确（Apache-2.0 / MIT），可用于论文实验
#   B = 协议不明 / unknown / gated，仅限内部探索，进论文实验集前必须先确认授权
#
# usage 语义：
#   expert_train   → 喂给专家 LoRA
#   router_train   → 派生路由训练数据（注意：必须与 expert_train 切分，见 docs/finetune_data_plan.md 第 5.1 节）
#   statute_kb     → 法条原文，进知识库 / 生成法条任务
#   case_corpus    → 案例语料，按需抽样，禁止整下
#   general_replay → 通用回放，防灾难性遗忘
#   reference_only → 仅参考格式，不实际训练

meta:
  probed_at: "2026-09-17"
  probed_on: "192.168.195.61"
  endpoint: "https://hf-mirror.com"
  # 重要陷阱：hf-mirror 对「不存在的仓库」返回 HTTP 401 而非 404，
  # 因此不允许用「凭记忆猜 ID + 探测」的方式判断可用性，必须先用搜索接口反查真实 ID。
  known_trap: "hf-mirror returns HTTP 401 for non-existent repos (not 404)"
  # HF 搜索接口对中文关键词无效（'法律'/'刑法'/'判决'/'法条' 均返回 0 条），只能靠英文或已知 ID 定位。

sources:

  # ============================================================
  # A 级：协议明确，可用于论文实验
  # ============================================================

  - id: ShengbinYue/DISC-Law-SFT
    hub: huggingface
    size_bytes: 606524000        # ~579.2 MB
    file_count: 6
    license: apache-2.0
    license_grade: A
    usage: [expert_train, router_train, general_replay]
    note: >
      主力语料，403K 样本。含 DISC-Law-SFT-Pair.jsonl(346.8MB) /
      -Pair-QA-released.jsonl(94.0MB) / -Triplet-QA-released.jsonl(85.5MB) /
      -Triplet-released.jsonl(52.8MB)。
      字段为 {id, input, output}；id 前缀编码任务类型（如 jud_doc_sum-1）。
      判决类样本的 input 自带案由与文书类型 → 民法/刑法域可正则抽取。
      内置 48K Alpaca-GPT4 + 60K Firefly 通用数据，可直接做 general_replay。
    correction: "此前误记为 FudanDISC/DISC-Law-SFT，真实 ID 为 ShengbinYue/DISC-Law-SFT"

  - id: Skepsun/lawyer_llama_data
    hub: huggingface
    size_bytes: 25165824         # ~24.0 MB
    file_count: 3                # all.json / .gitattributes / README.md
    license: apache-2.0
    license_grade: A
    usage: [expert_train, router_train]
    note: >
      司法考试题。字段 {input, instruction, output, history, source, prefix}，
      source 直接标来源（如 judical_examination.json）。
      实测样本即为《民事诉讼法》《刑事诉讼法》程序法题（"简易程序""补充侦查"）
      → 程序法域的关键现成来源。
    risk: "LexRubric 的 sifakaoshi split 同为司法考试题，存在同源风险，阶段 3 去污必须核查"

  - id: Dusker/lawyer-llama
    hub: huggingface
    size_bytes: 468000000        # ~446.3 MB
    file_count: 7
    license: mit
    license_grade: A
    usage: [expert_train, case_corpus]
    note: >
      含 kg_crime_llama.json (7.14 MB) —— 犯罪知识图谱数据，刑法域可转问答。
      另含 DISC-Law-SFT-Pair.json / -Triplet.json，与主源重复，注意去重。

  - id: twang2218/chinese-law-and-regulations
    hub: huggingface
    size_bytes: 168000000        # ~160.3 MB
    file_count: 4                # data/train-*.parquet + metadata/train-*.parquet
    license: apache-2.0
    license_grade: A
    usage: [statute_kb]
    note: "大体量带元数据法条库。协议干净，是「可用于论文」的法条原文首选。"

  - id: pandalla/chinese_law_examples
    hub: huggingface
    size_bytes: 524288           # ~0.5 MB
    file_count: 3                # law_item.jsonl
    license: apache-2.0
    license_grade: A
    usage: [reference_only]
    note: "体量极小，仅作格式参考。"

  - id: Aiiluo/Chinese-Law-SFT-Dataset
    hub: huggingface
    size_bytes: 2726297          # ~2.6 MB
    file_count: 6
    license: apache-2.0
    license_grade: A
    gated: auto                  # 需登录 HF 账号，服务器上需配置 token
    usage: [expert_train]
    note: >
      文件名已按域分好：Chinese_Civil_and_Commercial Law_*_Basic / _Case、
